services:
  - type: web
    name: mern-chat-backend
    env: node
    rootDir: backend
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
